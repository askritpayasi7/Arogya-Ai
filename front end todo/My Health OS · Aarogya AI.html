 else if(o<95)L.push({id:'o2',s:'warn',i:'🫁',t:'Oxygen slightly under 95%',d:`SpO₂ ${o}%. Re-check after resting. ${P.cond.includes('Asthma')?'With asthma, keep your inhaler close.':'Smoking can lower readings.'}`,q:'Why is my oxygen low?',act:'log'});
